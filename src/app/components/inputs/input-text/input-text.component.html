<div class="input-field">
    <label class="input-field__label" [for]="inputId">
        <span class="input-field__chevron" aria-hidden="true">›</span>
        {{ label }}
    </label>

    <div class="input-field__control">
        <input class="input-field__input" [id]="inputId" type="text" [value]="value ?? ''" [disabled]="disabled"
            [required]="required" (input)="handleInput($event)" />
    </div>

    <div *ngIf="onErrors().length; else elseBlock" class="input-field__errors" aria-live="polite">

        <span class="input-field__error" *ngFor="let error of onErrors()">
            {{ error }}
        </span>
    </div>

    <ng-template #elseBlock>
        <span class="input-field__info" *ngIf="information">
            {{ information }}
        </span>
    </ng-template>
</div>
