<div class="input-field">
    <label class="input-field__label" [for]="inputId">
        <span class="input-field__chevron" aria-hidden="true">›</span>
        {{ label }}
    </label>

    <div class="input-field__control">
        <input class="input-field__input" [attr.aria-describedby]="errors ? inputId + '-error' : null"
            [attr.aria-invalid]="errors" [id]="inputId" (blur)="handleBlur()" type="text" [value]="value ?? ''"
            [placeholder]="placeholder" [disabled]="disabled" [required]="required" (input)="handleInput($event)" />
    </div>

    <div *ngIf="onErrors() as error; else elseBlock" class="input-field__errors" aria-live="polite">
        <span class="input-field__error">
            {{ error }}
        </span>
    </div>

    <ng-template #elseBlock>
        <span class="input-field__hint" *ngIf="information">
            {{ information }}
        </span>
    </ng-template>
</div>
