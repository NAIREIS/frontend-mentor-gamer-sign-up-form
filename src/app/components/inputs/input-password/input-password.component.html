<div class="input-container">
    <label>
        <span class="chevron">›</span>
        {{ label }}
    </label>

    <input type="text" [value]="value ?? ''" [type]="'password'" [placeholder]="placeholder" [disabled]="disabled" [required]="required"
        (input)="handleInput($event)" (blur)="handleBlur()" />

    <span class="input-error" *ngFor="let error of onErrors()">
        {{ error }}
    </span>


    <div class="password-strength" *ngIf="value">

        <div class="strength-bar">
            <span [ngClass]="{weak: passwordStrength == 'weak'}"></span>
            <span [ngClass]="{medium: passwordStrength == 'medium'}"></span>
            <span [ngClass]="{good: passwordStrength == 'good'}"></span> 
            <span [ngClass]="{strong: passwordStrength == 'strong'}"></span>
        </div>

        <small [ngClass]="passwordStrength">
            {{
            passwordStrength === 'weak' ? 'Senha fraca' :
            passwordStrength === 'medium' ? 'Senha média' : passwordStrength === 'good'
            ? 'Senha boa' : 'Senha forte'
            }}
        </small>

      

    </div>
</div>
