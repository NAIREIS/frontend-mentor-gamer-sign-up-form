<div class="input-field">
  <label class="input-field__label" [for]="inputId">
    <span class="input-field__chevron" aria-hidden="true">›</span>
    {{ label }}
  </label>

  <div class="input-field__control">
    <input class="input-field__input" [id]="inputId" [type]="visiblePassword ? 'text' : 'password'"
      [value]="value ?? ''" [disabled]="disabled" [required]="required" (input)="handleInput($event)" />

    <button class="input-field__password-toggle" type="button" [disabled]="disabled" [attr.aria-label]="visiblePassword
        ? 'Ocultar senha'
        : 'Mostrar senha'" [attr.aria-pressed]="visiblePassword" (click)="toggleVisibitity()">

      <svg *ngIf="visiblePassword; else hiddenPasswordIcon"  xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#bff538" stroke-linecap="square" stroke-width="1.25" d="M8.333 4.333A7.5 7.5 0 0 1 10 4.167c5.333 0 8.333 5.833 8.333 5.833a14.2 14.2 0 0 1-2 2.75M5.334 5.417C3 7 1.667 10 1.667 10s3 5.833 8.333 5.833a8 8 0 0 0 4.334-1.333M2.5 2.5l15 15"/></svg>

      <ng-template #hiddenPasswordIcon>
       <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#9fadbc" stroke-linecap="square" stroke-width="1.25" d="M1.667 10s3-5.833 8.333-5.833S18.334 10 18.334 10s-3 5.833-8.334 5.833S1.667 10 1.667 10Z"/><path stroke="#9fadbc" stroke-linecap="square" stroke-width="1.25" d="m10 7.5 2.5 2.5-2.5 2.5L7.5 10z"/></svg>
      </ng-template>
    </button>
  </div>

  <div *ngIf="onErrors().length" class="input-field__errors" aria-live="polite">
    <span *ngFor="let error of onErrors()" class="input-field__error">
      {{ error }}
    </span>
  </div>

  <div *ngIf=" value && passwordStrengthBar" class="input-field__strength" aria-live="polite">
    <div class="input-field__strength-bar" [attr.aria-label]="'Segurança da senha: ' + passwordStrength">
      <span *ngFor="let level of ['weak', 'medium', 'good', 'strong']" [class.is-active]="
          ['weak', 'medium', 'good', 'strong'].indexOf(level) <=
          ['weak', 'medium', 'good', 'strong'].indexOf(passwordStrength)
        " [ngClass]="'input-field__strength-segment--' + level"></span>
    </div>

    <small class="input-field__strength-label" [ngClass]="'input-field__strength-label--' + passwordStrength">
      {{
      passwordStrength === 'weak' ? 'Senha fraca' :
      passwordStrength === 'medium' ? 'Senha média' :
      passwordStrength === 'good' ? 'Senha boa' :
      'Senha forte'
      }}
    </small>
  </div>
</div>
