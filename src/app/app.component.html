<section class="brand">
  <header class="brand__header">
    <img class="brand__logo" src="assets/images/logo.svg" alt="NEONCORE logo" />

    <h1 class="brand__title">JOIN THE NEXUS</h1>

    <p class="brand__subtitle">
      Initialize your neoncore identity
    </p>
  </header>

  <div class="brand__status">


    <ng-container *ngFor="let status of statuses">
      <div class="brand__status-item">
        <span class="brand__status-label">
          {{ status.label }}
        </span>
        <div class="brand__status-decoration"></div>
        <span class="brand__status-value" [class.brand__status-value--pending]="status.pending">
          {{ status.value }}
        </span>

      </div>
      <h3 class="brand__status-form" *ngIf="status.showText">{{form.get(status.control)?.value || 'Unassigned'}}</h3>
    </ng-container>
  </div>
</section>

<!-- Signup / Formulário de cadastro -->
<section class="signup">
  <form class="signup__form" [formGroup]="form">
    <header class="signup__header">
      <h2 class="signup__title">New operator</h2>

      <p class="signup__subtitle">
        All fields required
      </p>
    </header>

    <div class="signup__fields">
      <app-input-text class="signup__field" [label]="'Callsign'" formControlName="callsign"
        [placeholder]="'e.g. Vortex_07'" [information]="'3-20 characters: letters, numbers, _ or -'"></app-input-text>

      <app-input-text class="signup__field" [label]="'Email'" formControlName="email"
        [placeholder]="'you@example.com'"></app-input-text>

      <app-input-password class="signup__field" [label]="'Password'" formControlName="password"
        [placeholder]="'Enter password'"></app-input-password>

      <app-input-password class="signup__field" [label]="'Confirm Password'" formControlName="confirmPassword"
        [placeholder]="'Confirm password'" [passwordStrengthBar]="false"></app-input-password>
    </div>

    <div class="signup__footer">
      <app-input-checkbox class="signup__terms" formControlName="acceptTerms">
        <span>
          I accept the
          <a class="signup__legal-link" href="/terms">
            Terms
          </a>
          and
          <a class="signup__legal-link" href="/privacy">
            Privacy Policy
          </a>
        </span>
      </app-input-checkbox>

      <app-button-main class="signup__submit" [disabled]="form.invalid" format="full">
        INITIALIZE ACCOUNT
      </app-button-main>

      <p class="signup__login-prompt">
        Already an operator?
        <a class="signup__login-link" href="/login">
          Log in
        </a>
      </p>
    </div>
  </form>
</section>
